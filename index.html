<style>
  :root {
    --bg: #f2eee4;
    --surface: #fbf9f3;
    --surface-2: #f6f1e6;
    --ink: #22302b;
    --ink-2: #53625c;
    --muted: #7d8982;
    --line: rgba(34, 48, 43, 0.12);
    --line-strong: rgba(34, 48, 43, 0.2);
    --green: #235c4a;
    --green-2: #2f725d;
    --green-soft: #e1ebe4;
    --gold: #b47b38;
    --gold-2: #c99048;
    --gold-soft: #f1e5cf;
    --red: #a44f42;
    --red-soft: #f3e4df;
    --shadow: 0 18px 44px rgba(39, 45, 38, 0.08);
    --shadow-strong: 0 26px 70px rgba(20, 34, 28, 0.24);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --serif-cn: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 0%, rgba(180, 123, 56, 0.08), transparent 34%),
      #e8e1d3;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, input, textarea { font: inherit; }
  button {
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  [hidden] { display: none !important; }

  ::selection { background: rgba(180, 123, 56, 0.24); }
  :focus-visible { outline: 3px solid rgba(180, 123, 56, 0.46); outline-offset: 2px; }

  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 520px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background:
      radial-gradient(circle at 100% 0%, rgba(35, 92, 74, 0.05), transparent 28%),
      var(--bg);
    box-shadow: 0 0 70px rgba(34, 44, 38, 0.08);
  }

  /* ---------- Top bar ---------- */
  .appbar {
    position: relative;
    z-index: 20;
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(10px + var(--safe-top)) 16px 10px;
    background: rgba(242, 238, 228, 0.9);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .brand__mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    border-radius: 12px;
    color: #f8f2e5;
    background:
      radial-gradient(circle at 70% 20%, rgba(201, 144, 72, 0.44), transparent 42%),
      linear-gradient(145deg, #2b6653, #1d4337);
    font-family: var(--serif-cn);
    font-size: 1.05rem;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 6px 14px rgba(27, 61, 50, 0.16);
  }

  .brand__mark::after {
    content: "";
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold-2);
  }

  .brand__copy {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .brand__name {
    font-family: var(--serif-cn);
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    line-height: 1.05;
  }

  .brand__date {
    overflow: hidden;
    color: var(--muted);
    font-size: 0.62rem;
    letter-spacing: 0.01em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .quick-import {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 38px;
    padding: 8px 13px;
    border: 1px solid rgba(35, 92, 74, 0.14);
    border-radius: 999px;
    color: var(--green);
    background: var(--green-soft);
    font-size: 0.74rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .quick-import svg { width: 15px; height: 15px; }
  .quick-import:active { transform: scale(0.98); }

  /* ---------- Scrollable main ---------- */
  .main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 5px 16px 26px;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  .main::-webkit-scrollbar { display: none; }
  .main { scrollbar-width: none; }

  /* ---------- Bottom navigation ---------- */
  .tabbar {
    position: relative;
    z-index: 25;
    display: grid;
    flex: 0 0 auto;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 7px 20px calc(7px + var(--safe-bottom));
    border-top: 1px solid rgba(34, 48, 43, 0.1);
    background: rgba(251, 249, 243, 0.94);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
  }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-height: 48px;
    padding: 4px 2px;
    border: 0;
    border-radius: 14px;
    color: var(--muted);
    background: transparent;
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .tab__icon {
    display: grid;
    place-items: center;
    width: 40px;
    height: 26px;
    border-radius: 999px;
    transition: background-color 160ms ease, color 160ms ease;
  }

  .tab svg { width: 20px; height: 20px; }
  .tab.is-active { color: var(--green); }
  .tab.is-active .tab__icon { background: var(--green-soft); }

  /* ---------- Common ---------- */
  .page-intro {
    padding: 5px 2px 15px;
  }

  .overline {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    color: var(--gold);
    font-family: var(--serif);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .overline::before {
    content: "";
    width: 17px;
    height: 1px;
    background: currentColor;
    opacity: 0.7;
  }

  .page-intro h1 {
    margin: 8px 0 0;
    font-family: var(--serif-cn);
    font-size: 1.62rem;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.02em;
  }

  .page-intro p:not(.overline) {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 0.76rem;
    line-height: 1.6;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 46px;
    padding: 11px 16px;
    border: 1px solid transparent;
    border-radius: 14px;
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    transition: transform 150ms ease, background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
  }

  .btn:active { transform: scale(0.985); }
  .btn-primary { color: #fbf7ed; background: var(--green); box-shadow: 0 8px 18px rgba(35, 92, 74, 0.17); }
  .btn-primary:active { background: var(--green-2); }
  .btn-secondary { color: var(--ink); border-color: var(--line-strong); background: rgba(255, 255, 255, 0.4); }
  .btn-ghost { color: var(--ink-2); border-color: transparent; background: transparent; }
  .btn-ghost:active { background: rgba(34, 48, 43, 0.055); }
  .btn-cream { color: #20342c; background: #f2e5cd; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12); }
  .btn-cream:active { background: #fbf2e1; }
  .btn-outline-light { color: #f8f3e7; border-color: rgba(248, 243, 231, 0.26); background: rgba(255, 255, 255, 0.055); }
  .btn-danger { color: var(--red); border-color: rgba(164, 79, 66, 0.2); background: var(--red-soft); }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 38px; padding: 8px 12px; font-size: 0.72rem; border-radius: 12px; }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--ink-2);
    background: transparent;
    font-size: 1.15rem;
    line-height: 1;
  }

  .icon-btn:active { background: rgba(34, 48, 43, 0.06); }

  /* ---------- Today ---------- */
  .task-card {
    position: relative;
    overflow: hidden;
    padding: 20px;
    border-radius: 27px;
    color: #f8f3e7;
    background:
      radial-gradient(circle at 90% 12%, rgba(201, 144, 72, 0.2), transparent 28%),
      radial-gradient(circle at 6% 100%, rgba(112, 164, 137, 0.15), transparent 36%),
      linear-gradient(138deg, #2b5a4a 0%, #204537 48%, #182f29 100%);
    box-shadow: 0 22px 48px rgba(24, 47, 41, 0.18);
    isolation: isolate;
  }

  .task-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0.2;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
    background-size: 38px 38px;
    -webkit-mask-image: linear-gradient(90deg, transparent 10%, #000 100%);
    mask-image: linear-gradient(90deg, transparent 10%, #000 100%);
  }

  .task-card__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .task-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border: 1px solid rgba(248, 243, 231, 0.14);
    border-radius: 999px;
    color: rgba(248, 243, 231, 0.72);
    background: rgba(255, 255, 255, 0.055);
    font-size: 0.6rem;
    font-weight: 650;
    letter-spacing: 0.05em;
  }

  .task-pill::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold-2);
  }

  .streak {
    color: rgba(248, 243, 231, 0.45);
    font-size: 0.6rem;
    white-space: nowrap;
  }

  .task-card h1 {
    max-width: 300px;
    margin: 15px 0 9px;
    font-family: var(--serif-cn);
    font-size: clamp(1.82rem, 7.2vw, 2.42rem);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.025em;
  }

  .task-card h1 em {
    color: #e7bf86;
    font-family: var(--serif);
    font-size: 1.2em;
    font-style: normal;
    font-weight: 500;
    letter-spacing: -0.04em;
  }

  .task-card__sub {
    max-width: 300px;
    margin: 0;
    color: rgba(248, 243, 231, 0.62);
    font-size: 0.72rem;
    line-height: 1.65;
  }

  .task-card__actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .task-card__actions .btn {
    flex: 1;
    min-width: 0;
    min-height: 43px;
    padding: 9px 10px;
    border-radius: 13px;
    font-size: 0.76rem;
  }

  .task-card__top,
  .task-card h1,
  .task-card__sub,
  .task-card__actions {
    position: relative;
    z-index: 2;
  }

  .task-card__deco {
    position: absolute;
    right: -18px;
    bottom: -14px;
    width: 138px;
    height: 118px;
    z-index: 1;
    opacity: 0.45;
    pointer-events: none;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }

  .stat {
    padding: 13px 11px 12px;
    border: 1px solid var(--line);
    border-radius: 17px;

  }

  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'shici-iphone-v1';
  const INTERVALS = [1, 2, 4, 7, 15, 30];
  const MAX_STAGE = INTERVALS.length;
  const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const MAX_IMPORT_BYTES = 10 * 1024 * 1024;

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

  const els = {
    main: $('#appMain'),
    date: $('#appDate'),
    sheetLayer: $('#sheetLayer'),
    sheetContent: $('#sheetContent'),
    studyLayer: $('#studyLayer'),
    studyStage: $('#studyStage'),
    studySummary: $('#studySummary'),
    studyMode: $('#studyMode'),
    studyDay: $('#studyDay'),
    studyCount: $('#studyCount'),
    studyProgress: $('#studyProgress'),
    flashcard: $('#flashcard'),
    cardTag: $('#cardTag'),
    cardIndex: $('#cardIndex'),
    studyWord: $('#studyWord'),
    studyMeaning: $('#studyMeaning'),
    revealBtn: $('#revealBtn'),
    meaningBox: $('#meaningBox'),
    answerBar: $('#answerBar'),
    studyHint: $('#studyHint'),
    fileInput: $('#fileInput'),
    toast: $('#toast')
  };

  const ui = {
    tab: 'today',
    sheet: null,
    study: null,
    pendingImport: null,
    importError: '',
    importLoading: false,
    pasteMode: false,
    pasteDraft: '',
    fileName: '',
    filePurpose: 'merge',
    toastTimer: null,
    lastFocus: null,
    storageWarned: false
  };

  const storageOK = testStorage();
  let state = loadState();

  /* ------------------------------------------------------------------ */
  /* Utilities                                                          */
  /* ------------------------------------------------------------------ */

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  function clampInt(value, min, max, fallback) {
    const number = Number(value);
    if (!Number.isFinite(number)) return fallback;
    return Math.min(max, Math.max(min, Math.trunc(number)));
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function dateKeyOf(date) {
    return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  }

  function todayKey() {
    return dateKeyOf(new Date());
  }

  function parseDateKey(key) {
    if (typeof key !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return null;
    const parts = key.split('-').map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
    if (
      date.getFullYear() !== parts[0] ||
      date.getMonth() !== parts[1] - 1 ||
      date.getDate() !== parts[2]
    ) return null;
    return date;
  }

  function isDateKey(key) {
    return parseDateKey(key) !== null;
  }

  function addDaysKey(key, amount) {
    const date = parseDateKey(key) || new Date();
    date.setDate(date.getDate() + amount);
    return dateKeyOf(date);
  }

  function daysBetween(fromKey, toKey) {
    const from = parseDateKey(fromKey);
    const to = parseDateKey(toKey);
    if (!from || !to) return 0;
    const a = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
    const b = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((b - a) / 86400000);
  }

  function formatToday() {
    const date = new Date();
    return `${date.getMonth() + 1}月${date.getDate()}日 · ${WEEKDAYS[date.getDay()]}`;
  }

  function weekdayOf(key) {
    const date = parseDateKey(key);
    return date ? WEEKDAYS[date.getDay()] : '';
  }

  function formatShortDate(key) {
    const date = parseDateKey(key);
    return date ? `${date.getMonth() + 1}月${date.getDate()}日` : '';
  }

  function greeting() {
    const hour = new Date().getHours();
    if (hour < 6) return '夜深了';
    if (hour < 11) return '早上好';
    if (hour < 14) return '中午好';
    if (hour < 18) return '下午好';
    return '晚上好';
  }

  function normalizeWord(value) {
    return String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function uid(prefix) {
    try {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return `${prefix}_${crypto.randomUUID()}`;
      }
    } catch (error) {
      // Fall through.
    }
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
  }

  function escapeHtml(value) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(value == null ? '' : value).replace(/[&<>"']/g, (character) => map[character]);
  }

  function shuffle(items) {
    const list = items.slice();
    for (let index = list.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [list[index], list[swapIndex]] = [list[swapIndex], list[index]];
    }
    return list;
  }

  function showToast(message, type = 'success') {
    clearTimeout(ui.toastTimer);
    els.toast.textContent = message;
    els.toast.className = `toast is-visible${type === 'error' ? ' is-error' : ''}`;
    ui.toastTimer = setTimeout(() => els.toast.classList.remove('is-visible'), 2800);
  }

  function testStorage() {
    try {
      const key = '__shici_storage_test__';
      localStorage.setItem(key, '1');
      localStorage.removeItem(key);
      return true;
    } catch (error) {
      return false;
    }
  }

  /* ------------------------------------------------------------------ */
  /* State                                                              */
  /* ------------------------------------------------------------------ */

  function freshState() {
    const now = nowIso();
    return { version: 1, days: [], studyDates: [], createdAt: now, updatedAt: now };
  }

  function normalizeState(raw) {
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.days)) return null;

    const result = freshState();
    if (typeof raw.createdAt === 'string' && !Number.isNaN(Date.parse(raw.createdAt))) result.createdAt = raw.createdAt;
    if (typeof raw.updatedAt === 'string' && !Number.isNaN(Date.parse(raw.updatedAt))) result.updatedAt = raw.updatedAt;

    const dayMap = new Map();
    const usedIds = new Set();
    const usedWords = new Set();
    const dates = new Set();

    raw.days.forEach((rawDay) => {
      if (!rawDay || typeof rawDay !== 'object') return;
      const dayNumber = Number(rawDay.day);
      if (!Number.isInteger(dayNumber) || dayNumber <= 0) return;

      let day = dayMap.get(dayNumber);
      if (!day) {
        day = {
          day: dayNumber,
          title: typeof rawDay.title === 'string' && rawDay.title.trim() ? rawDay.title.trim() : `Day ${dayNumber}`,
          note: typeof rawDay.note === 'string' ? rawDay.note.trim() : '',
          importedAt: typeof rawDay.importedAt === 'string' ? rawDay.importedAt : nowIso(),
          updatedAt: typeof rawDay.updatedAt === 'string' ? rawDay.updatedAt : nowIso(),
          words: []
        };
        dayMap.set(dayNumber, day);
      } else if (!day.note && typeof rawDay.note === 'string') {
        day.note = rawDay.note.trim();
      }

      if (!Array.isArray(rawDay.words)) return;

      rawDay.words.forEach((rawWord) => {
        if (!rawWord || typeof rawWord !== 'object') return;
        const word = String(rawWord.word || '').trim();
        const meaning = String(rawWord.meaning || '').trim();
        if (!word || !meaning) return;

        const key = normalizeWord(word);
        if (!key || usedWords.has(key)) return;
        usedWords.add(key);

        let id = typeof rawWord.id === 'string' ? rawWord.id.trim() : '';
        if (!id || usedIds.has(id)) id = uid('w');
        usedIds.add(id);

        let learned = Boolean(rawWord.learned || rawWord.firstLearnedAt);
        let mastered = Boolean(rawWord.mastered) && learned;
        let stage = clampInt(rawWord.stage, 0, MAX_STAGE, 0);
        let nextDue = isDateKey(rawWord.nextDue) ? rawWord.nextDue : null;

        if (mastered) {
          stage = MAX_STAGE;
          nextDue = null;
        }
        if (learned && !mastered && !nextDue) nextDue = todayKey();
        if (!learned) {
          mastered = false;
          stage = 0;
          nextDue = null;
        }

        if (typeof rawWord.lastReviewedAt === 'string' && rawWord.lastReviewedAt) {
          const reviewed = new Date(rawWord.lastReviewedAt);
          if (!Number.isNaN(reviewed.getTime())) dates.add(dateKeyOf(reviewed));
        }

        day.words.push({
          id,
          word,
          meaning,
          createdAt: typeof rawWord.createdAt === 'string' ? rawWord.createdAt : nowIso(),
          learned,
          firstLearnedAt: typeof rawWord.firstLearnedAt === 'string' ? rawWord.firstLearnedAt : (learned ? nowIso() : null),
          stage,
          nextDue,
          mastered,
          reviewCount: clampInt(rawWord.reviewCount, 0, 100000, 0),
          lapseCount: clampInt(rawWord.lapseCount, 0, 100000, 0),
          lastResult: rawWord.lastResult === 'remember' || rawWord.lastResult === 'forgot' ? rawWord.lastResult : null,
          lastReviewedAt: typeof rawWord.lastReviewedAt === 'string' ? rawWord.lastReviewedAt : null
        });
      });
    });

    result.days = Array.from(dayMap.values())
      .filter((day) => day.words.length > 0)
      .sort((a, b) => a.day - b.day);

    if (Array.isArray(raw.studyDates)) {
      raw.studyDates.forEach((key) => {
        if (isDateKey(key)) dates.add(key);
      });
    }
    result.studyDates = Array.from(dates).sort();
    return result;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      return normalizeState(JSON.parse(raw)) || freshState();
    } catch (error) {
      return freshState();
    }
  }

  function saveState() {
    state.updatedAt = nowIso();
    if (!storageOK) {
      if (!ui.storageWarned) {
        ui.storageWarned = true;
        showToast('当前打开方式无法保存数据，请用 Safari 访问或把页面放到网址上。', 'error');
      }
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      showToast('保存失败：浏览器存储空间不足。', 'error');
    }
  }

  /* ------------------------------------------------------------------ */
  /* Queries and scheduling                                             */
  /* ------------------------------------------------------------------ */

  function allWords() {
    return state.days.flatMap((day) => day.words);
  }

  function getDayByNumber(dayNumber) {
    return state.days.find((day) => day.day === Number(dayNumber)) || null;
  }

  function getWordContext(wordId) {
    for (const day of state.days) {
      const word = day.words.find((item) => item.id === wordId);
      if (word) return { day, word };
    }
    return null;
  }

  function isDue(word) {
    return Boolean(word && word.learned && !word.mastered && word.nextDue && word.nextDue <= todayKey());
  }

  function getStats() {
    const words = allWords();
    const dueWords = words.filter(isDue);
    const mastered = words.filter((word) => word.mastered).length;
    const unlearned = words.filter((word) => !word.learned).length;
    return {
      total: words.length,
      days: state.days.length,
      due: dueWords.length,
      overdue: dueWords.filter((word) => word.nextDue < todayKey()).length,
      unlearned,
      mastered,
      masteryPct: words.length ? Math.round((mastered / words.length) * 100) : 0,
      streak: getStreak()
    };
  }

  function getDayStats(day) {
    const total = day.words.length;
    const learned = day.words.filter((word) => word.learned).length;
    const mastered = day.words.filter((word) => word.mastered).length;
    const due = day.words.filter(isDue).length;
    return {
      total,
      learned,
      mastered,
      due,
      unlearned: total - learned,
      progress: total ? Math.round((learned / total) * 100) : 0
    };
  }

  function getNextUnlearnedDay() {
    return state.days
      .slice()
      .sort((a, b) => a.day - b.day)
      .find((day) => day.words.some((word) => !word.learned)) || null;
  }

  function getStreak() {
    const studied = new Set(state.studyDates);
    if (!studied.size) return 0;
    let cursor = todayKey();
    if (!studied.has(cursor)) cursor = addDaysKey(cursor, -1);
    let streak = 0;
    while (studied.has(cursor) && streak < 3660) {
      streak += 1;
      cursor = addDaysKey(cursor, -1);
    }
    return streak;
  }

  function markStudyToday() {
    const key = todayKey();
    if (!state.studyDates.includes(key)) {
      state.studyDates.push(key);
      state.studyDates.sort();
    }
  }

  function applyRemember(word) {
    const now = nowIso();
    word.learned = true;
    if (!word.firstLearnedAt) word.firstLearnedAt = now;
    word.lastReviewedAt = now;
    word.lastResult = 'remember';
    word.reviewCount = clampInt(word.reviewCount, 0, 100000, 0) + 1;

    if (word.stage >= MAX_STAGE) {
      word.stage = MAX_STAGE;
      word.mastered = true;
      word.nextDue = null;
      return;
    }

    const interval = INTERVALS[clampInt(word.stage, 0, MAX_STAGE - 1, 0)];
    word.stage = clampInt(word.stage, 0, MAX_STAGE, 0) + 1;
    word.nextDue = addDaysKey(todayKey(), interval);
    word.mastered = false;
  }

  function applyForget(word) {
    const now = nowIso();
    word.learned = true;
    if (!word.firstLearnedAt) word.firstLearnedAt = now;
    word.lastReviewedAt = now;
    word.lastResult = 'forgot';
    word.lapseCount = clampInt(word.lapseCount, 0, 100000, 0) + 1;
    word.stage = 0;
    word.mastered = false;
    word.nextDue = addDaysKey(todayKey(), 1);
  }

  function stageLabel(word) {
    if (!word.learned) return '未学';
    if (word.mastered) return '已掌握';
    if (word.stage <= 0) return '待巩固';
    return `第 ${word.stage} 阶`;
  }

  function dueText(word) {
    if (!word.learned) return '未开始';
    if (word.mastered) return '已完成';
    if (!word.nextDue) return '待安排';
    const today = todayKey();
    if (word.nextDue === today) return '今天复习';
    if (word.nextDue < today) return `逾期 ${daysBetween(word.nextDue, today)} 天`;
    return formatShortDate(word.nextDue);
  }

  function makeWord(word, meaning) {
    return {
      id: uid('w'),
      word,
      meaning,
      createdAt: nowIso(),
      learned: false,
      firstLearnedAt: null,
      stage: 0,
      nextDue: null,
      mastered: false,
      reviewCount: 0,
      lapseCount: 0,
      lastResult: null,
      lastReviewedAt: null
    };
  }

  /* ------------------------------------------------------------------ */
  /* JSON import                                                        */
  /* ------------------------------------------------------------------ */

  const WORD_SEPARATORS = [
    /^(.+?)\s*—\s*(.+)$/,
    /^(.+?)\s*–\s*(.+)$/,
    /^(.+?)\s+--\s+(.+)$/,
    /^(.+?)\s+-\s+(.+)$/,
    /^(.+?)\t+(.+)$/
  ];

  function cleanWord(value) {
    return String(value || '')
      .replace(/^[-*•·]\s*/, '')
      .replace(/[*_`~]/g, '')
      .replace(/^[\s"'“”‘’「」【】]+|[\s"'“”‘’「」【】]+$/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function cleanMeaning(value) {
    return String(value || '')
      .replace(/\*\*/g, '')
      .replace(/^[\s—–:：\-]+/, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function parseWordLine(line) {
    let content = String(line || '')
      .replace(/^[-*•·]\s+/, '')
      .replace(/^\d+\s*[.、)）]\s*/, '')
      .trim();

    for (const separator of WORD_SEPARATORS) {
      const match = content.match(separator);
      if (match) {
        const word = cleanWord(match[1]);
        const meaning = cleanMeaning(match[2]);
        if (word && meaning) return { word, meaning };
        return null;
      }
    }
    return null;
  }

  function normalizeWordEntry(entry) {
    if (Array.isArray(entry)) {
      const word = cleanWord(entry[0]);
      const meaning = cleanMeaning(entry[1]);
      return word && meaning ? { word, meaning } : null;
    }

    if (entry && typeof entry === 'object') {
      const word = cleanWord(entry.word ?? entry.term ?? entry.en ?? entry.name ?? entry.english);
      const meaning = cleanMeaning(entry.meaning ?? entry.definition ?? entry.def ?? entry.cn ?? entry.translation ?? entry.chinese);
      return word && meaning ? { word, meaning } : null;
    }

    if (typeof entry === 'string') return parseWordLine(entry);
    return null;
  }

  function dayNumberFrom(value) {
    if (typeof value === 'number' && Number.isInteger(value) && value > 0) return value;
    const match = String(value == null ? '' : value).match(/\d+/);
    if (!match) return null;
    const number = Number(match[0]);
    return Number.isInteger(number) && number > 0 ? number : null;
  }

  function noteFromItem(item) {
    let note = String(item.note ?? item.label ?? item.memo ?? item.desc ?? '').trim();
    if (!note && typeof item.title === 'string') {
      note = item.title
        .replace(/^day\s*\d+\s*/i, '')
        .replace(/^[（(]\s*/, '')
        .replace(/\s*[）)]\s*$/, '')
        .trim();
    }
    return note;
  }

  function parsePackage(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('JSON 内容为空。');

    let source = raw;
    if (raw.data && typeof raw.data === 'object' && (Array.isArray(raw.data.days) || raw.data.day != null)) {
      source = raw.data;
    }

    let inputs = [];
    if (Array.isArray(source.days)) {
      inputs = source.days;
    } else if (source.days && typeof source.days === 'object') {
      inputs = Object.entries(source.days).map(([key, value]) => ({ day: key, ...(value || {}) }));
    } else if (Array.isArray(source)) {
      inputs = source;
    } else if (source.day != null) {
      inputs = [source];
    } else {
      throw new Error('没有找到 day 或 days 字段，无法识别。');
    }

    const warnings = [];
    const days = [];
    const seenWords = new Set();

    inputs.forEach((item, index) => {
      if (!item || typeof item !== 'object') {
        warnings.push(`第 ${index + 1} 天格式不正确，已跳过。`);
        return;
      }

      const dayNumber = dayNumberFrom(item.day ?? item.dayNumber ?? item.dayIndex ?? item.title);
      if (!dayNumber) {
        warnings.push(`第 ${index + 1} 天缺少有效的 Day 编号，已跳过。`);
        return;
      }

      let rawWords = item.words ?? item.wordList ?? item.list ?? item.items ?? item.text;
      let entries = [];
      if (Array.isArray(rawWords)) {
        entries = rawWords;
      } else if (typeof rawWords === 'string') {
        entries = rawWords.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      } else if (rawWords && typeof rawWords === 'object') {
        if (rawWords.word || rawWords.term || rawWords.en) {
          entries = [rawWords];
        } else {
          entries = Object.entries(rawWords).map(([word, meaning]) => ({ word, meaning }));
        }
      } else {
        warnings.push(`Day ${dayNumber} 没有 words 词条，已跳过。`);
        return;
      }

      const words = [];
      entries.forEach((entry, entryIndex) => {
        const parsed = normalizeWordEntry(entry);
        if (!parsed) {
          warnings.push(`Day ${dayNumber} 第 ${entryIndex + 1} 条缺少单词或释义，已跳过。`);
          return;
        }
        if (parsed.word.length > 100) {
          warnings.push(`Day ${dayNumber} 第 ${entryIndex + 1} 条单词过长，已跳过。`);
          return;
        }
        const key = normalizeWord(parsed.word);
        if (seenWords.has(key)) {
          warnings.push(`「${parsed.word}」重复出现，只保留第一次。`);
          return;
        }
        seenWords.add(key);
        words.push(parsed);
      });

      if (words.length) {
        days.push({ day: dayNumber, note: noteFromItem(item), words });
      } else {
        warnings.push(`Day ${dayNumber} 没有可用的单词，已跳过。`);
      }
    });

    if (!days.length) throw new Error('没有识别到可导入的 Day 和单词。');
    days.sort((a, b) => a.day - b.day);
    return { days, warnings };
  }

  function parseJsonText(text) {
    let raw;
    try {
      raw = JSON.parse(String(text || '').replace(/^\uFEFF/, ''));
    } catch (error) {
      throw new Error('JSON 格式不正确，请检查括号、引号和逗号。');
    }
    return parsePackage(raw);
  }

  function analyzePackage(pkg) {
    const existing = new Set(allWords().map((word) => normalizeWord(word.word)));
    let newCount = 0;
    let duplicateCount = 0;
    const changedDays = [];

    pkg.days.forEach((day) => {
      const fresh = day.words.filter((word) => !existing.has(normalizeWord(word.word)));
      newCount += fresh.length;
      duplicateCount += day.words.length - fresh.length;
      if (fresh.length) {
        changedDays.push({
          day: day.day,
          note: day.note,
          total: day.words.length,
          newCount: fresh.length,
          words: fresh
        });
      }
    });

    return {
      newCount,
      duplicateCount,
      changedDays,
      startDay: changedDays.length ? changedDays[0].day : null
    };
  }

  function mergePackage(pkg) {
    const existing = new Set(allWords().map((word) => normalizeWord(word.word)));
    let added = 0;
    let skipped = 0;
    let startDay = null;

    pkg.days.forEach((pkgDay) => {
      const fresh = pkgDay.words.filter((word) => !existing.has(normalizeWord(word.word)));
      skipped += pkgDay.words.length - fresh.length;
      if (!fresh.length) return;

      let day = getDayByNumber(pkgDay.day);
      if (!day) {
        day = {
          day: pkgDay.day,
          title: `Day ${pkgDay.day}`,
          note: pkgDay.note || '',
          importedAt: nowIso(),
          updatedAt: nowIso(),
          words: []
        };
        state.days.push(day);
      } else if (!day.note && pkgDay.note) {
        day.note = pkgDay.note;
      }

      fresh.forEach((word) => {
        const key = normalizeWord(word.word);
        if (existing.has(key)) {
          skipped += 1;
          return;
        }
        day.words.push(makeWord(word.word, word.meaning));
        existing.add(key);
        added += 1;
      });

      day.words.sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));
      day.updatedAt = nowIso();
      if (startDay === null) startDay = day.day;
    });

    if (added > 0) {
      state.days.sort((a, b) => a.day - b.day);
      saveState();
    }
    return { added, skipped, startDay };
  }

  /* ------------------------------------------------------------------ */
  /* Render helpers                                                     */
  /* ------------------------------------------------------------------ */

  function init() {
    els.date.textContent = formatToday();
    renderApp();
    if (!storageOK) {
      setTimeout(() => showToast('当前浏览器无法持久保存，请阅读「数据」页的打开方式。', 'error'), 500);
    }
    let lastDay = todayKey();
    setInterval(() => {
      const current = todayKey();
      if (current !== lastDay) {
        lastDay = current;
        if (!ui.sheet && !ui.study) {
          els.date.textContent = formatToday();
          renderApp();
        }
      }
    }, 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !ui.sheet && !ui.study) {
        els.date.textContent = formatToday();
        renderApp();
      }
    });
  }

  function renderApp() {
    els.date.textContent = formatToday();
    $$('.tab').forEach((tab) => {
      const active = tab.dataset.tab === ui.tab;
      tab.classList.toggle('is-active', active);
      if (active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });

    if (ui.tab === 'today') els.main.innerHTML = renderToday();
    else if (ui.tab === 'words') els.main.innerHTML = renderWords();
    else els.main.innerHTML = renderData();
  }

  function switchTab(tab) {
    if (!['today', 'words', 'data'].includes(tab)) return;
    ui.tab = tab;
    renderApp();
    els.main.scrollTop = 0;
  }

  function renderToday() {
    const stats = getStats();
    if (!stats.total) {
      return `
        <div class="page-intro">
          <p class="overline">今日</p>
          <h1>${greeting()}，今天也背一点。</h1>
        </div>
        ${!storageOK ? '<div class="storage-warning">这个打开方式无法可靠保存数据。请用 Safari 打开，或把本页放到一个网址上使用。</div>' : ''}
        ${renderEmpty()}`;
    }

    const nextDay = getNextUnlearnedDay();
    const nextStats = nextDay ? getDayStats(nextDay) : null;

    return `
      <div class="page-intro">
        <p class="overline">今日</p>
        <h1>${greeting()}，今天也背一点。</h1>
      </div>
      ${renderTaskCard(stats, nextDay, nextStats)}
      <div class="stat-grid">
        ${renderStat('待复习', stats.due, '词')}
        ${renderStat('待学', stats.unlearned, '词')}
        ${renderStat('已掌握', stats.mastered, '词')}
      </div>
      ${renderPlan()}
      ${renderRecentDays()}`;
  }

  function renderStat(label, value, unit) {
    return `<div class="stat"><span>${label}</span><strong>${value}<small>${unit}</small></strong></div>`;
  }

  function renderTaskCard(stats, nextDay, nextStats) {
    let headline = '';
    let subline = '';
    let actions = '';

    if (stats.due > 0) {
      headline = `还有 <em>${stats.due}</em> 个词<br>等你复习。`;
      subline = stats.overdue
        ? `其中 ${stats.overdue} 个已经逾期。先把旧的捞回来，再学新的。`
        : '按记忆曲线到期。先复习，再学新词。';
      actions = `
        <button class="btn btn-cream" type="button" data-action="review-all">开始复习</button>
        ${nextDay && nextStats
          ? `<button class="btn btn-outline-light" type="button" data-action="learn-day" data-day="${nextDay.day}">学 Day ${nextDay.day}</button>`
          : `<button class="btn btn-outline-light" type="button" data-action="open-import">导入新词</button>`}`;
    } else if (nextDay && nextStats) {
      headline = `今天有 <em>${stats.unlearned}</em> 个<br>新词要认识。`;
      subline = `从 Day ${nextDay.day} 开始。先回想，再显示释义，记住就前进。`;
      actions = `
        <button class="btn btn-cream" type="button" data-action="learn-day" data-day="${nextDay.day}">开始学习</button>
        <button class="btn btn-outline-light" type="button" data-action="open-import">导入新词</button>`;
    } else {
      headline = '今天的任务<br>已经完成。';
      subline = '没有到期复习。可以导入明天的词，或者去词单看看每个词的进度。';
      actions = `
        <button class="btn btn-cream" type="button" data-action="open-import">导入新词</button>
        <button class="btn btn-outline-light" type="button" data-tab="words">查看词单</button>`;
    }

    return `
      <section class="task-card">
        <div class="task-card__top">
          <span class="task-pill">今日任务</span>

  function renderPlan() {
    const dates = [1, 2, 3].map((offset) => addDaysKey(todayKey(), offset));
    const labels = ['明天', '后天', weekdayOf(dates[2])];
    const chips = dates.map((date, index) => {
      const count = allWords().filter((word) => !word.mastered && word.nextDue === date).length;
      return `<div class="plan-chip${count ? '' : ' is-quiet'}"><span>${labels[index]}</span><strong>${count}</strong></div>`;
    }).join('');

    return `
      <section class="section">
        <div class="section-head"><h2>接下来</h2><span class="aside">复习会按曲线自动出现</span></div>
        <div class="plan-grid">${chips}</div>
      </section>`;
  }

  function renderRecentDays() {
    const recent = state.days.slice().sort((a, b) => b.day - a.day).slice(0, 3);
    return `
      <section class="section">
        <div class="section-head">
          <h2>我的词单</h2>
          ${state.days.length > 3 ? '<button class="section-link" type="button" data-tab="words">全部</button>' : ''}
        </div>
        <div class="day-list">${recent.map(renderDayRow).join('')}</div>
      </section>`;
  }

  function renderDayRow(day) {
    const stats = getDayStats(day);
    let badgeClass = 'badge-idle';
    let badgeText = '巩固中';
    if (stats.due > 0) {
      badgeClass = 'badge-due';
      badgeText = `复习 ${stats.due}`;
    } else if (stats.unlearned > 0) {
      badgeClass = 'badge-new';
      badgeText = `待学 ${stats.unlearned}`;
    } else if (stats.total > 0 && stats.mastered === stats.total) {
      badgeClass = 'badge-ok';
      badgeText = '已掌握';
    }

    return `
      <button class="day-row" type="button" data-action="open-day" data-day="${day.day}">
        <span class="day-num">${pad2(day.day)}</span>
        <span class="day-copy">
          <h3>Day ${day.day}<span class="badge ${badgeClass}">${badgeText}</span></h3>
          <p>${escapeHtml([day.note, `${stats.total} 个单词`].filter(Boolean).join(' · '))}</p>
          <span class="day-progress"><i style="width:${stats.progress}%"></i></span>
        </span>
      </button>`;
  }

  /* ------------------------------------------------------------------ */
  /* Sheet                                                              */
  /* ------------------------------------------------------------------ */

  function openSheet(kind, payload = {}) {
    if (ui.study) return;
    ui.lastFocus = document.activeElement;
    ui.sheet = { kind, ...payload };
    els.sheetLayer.hidden = false;
    renderSheet();
    requestAnimationFrame(() => {
      const target = els.sheetContent.querySelector('#pasteInput') || els.sheetContent.querySelector('.icon-btn') || els.sheetContent.querySelector('button');
      if (target) {
        try { target.focus({ preventScroll: true }); } catch (error) { target.focus(); }
      }
    });
  }

  function closeSheet() {
    if (els.sheetLayer.hidden) return;
    els.sheetLayer.hidden = true;
    els.sheetContent.innerHTML = '';
    ui.sheet = null;
    ui.pendingImport = null;
    ui.importError = '';
    ui.importLoading = false;
    ui.pasteMode = false;
    if (ui.lastFocus && typeof ui.lastFocus.focus === 'function' && document.contains(ui.lastFocus)) {
      try { ui.lastFocus.focus({ preventScroll: true }); } catch (error) { ui.lastFocus.focus(); }
    }
    ui.lastFocus = null;
  }

  function openImportSheet() {
    ui.pendingImport = null;
    ui.importError = '';
    ui.importLoading = false;
    ui.pasteMode = false;
    ui.pasteDraft = '';
    ui.fileName = '';
    openSheet('import');
  }

  function openPasteSheet() {
    ui.pendingImport = null;
    ui.importError = '';
    ui.importLoading = false;
    ui.pasteMode = true;
    ui.pasteDraft = '';
    ui.fileName = '';
    openSheet('import');
  }

  function renderSheet() {
    if (!ui.sheet) {
      els.sheetContent.innerHTML = '';
      return;
    }
    if (ui.sheet.kind === 'day') {
      renderDaySheet();
      return;
    }
    renderImportSheet();
    afterSheetRender();
  }

  function sheetHead(title, subtitle, eyebrow = '') {
    return `
      <div class="sheet-head">
        <div>
          ${eyebrow ? `<p class="overline">${escapeHtml(eyebrow)}</p>` : ''}
          <h2 id="sheetTitle">${escapeHtml(title)}</h2>
          ${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}
        </div>
        <button class="icon-btn" type="button" data-action="close-sheet" aria-label="关闭">×</button>
      </div>`;
  }

  function renderImportSheet() {
    if (ui.importLoading) {
      els.sheetContent.innerHTML = `
        ${sheetHead('正在读取', '从电脑传来的 JSON', '导入')}
        <div class="sheet-body"><div class="loading"><span class="spinner"></span>正在解析词表…</div></div>`;
      return;
    }

    if (ui.pendingImport) {
      renderImportPreview();
      return;
    }

    if (ui.pasteMode) {
      const error = ui.importError ? `<div class="alert">${escapeHtml(ui.importError)}</div>` : '';
      els.sheetContent.innerHTML = `
        ${sheetHead('粘贴 JSON', '把电脑生成的 JSON 文本贴进来', '导入')}
        <div class="sheet-body">
          ${error}
          <textarea class="paste-area" id="pasteInput" spellcheck="false" placeholder='{
  "day": 2,
  "note": "A-Z 排序",
  "words": [
    { "word": "accelerator", "meaning": "n. 加速器" }
  ]
}'></textarea>
          <div class="note-box">只添加手机上没有的单词，不覆盖已有的复习进度。</div>
        </div>
        <div class="sheet-foot">
          <button class="btn btn-ghost" type="button" data-action="back-to-file">选文件</button>
          <span class="spacer"></span>
          <button class="btn btn-primary" type="button" data-action="parse-paste">识别 JSON</button>
        </div>`;
      requestAnimationFrame(() => {
        const textarea = $('#pasteInput');
        if (textarea) {
          textarea.value = ui.pasteDraft;
          try { textarea.focus({ preventScroll: true }); } catch (error) { textarea.focus(); }
        }
      });
      return;
    }

    const error = ui.importError ? `<div class="alert">${escapeHtml(ui.importError)}</div>` : '';
    els.sheetContent.innerHTML = `
      ${sheetHead('导入电脑数据', '选择电脑导出的 JSON 文件', '电脑 → iPhone')}
      <div class="sheet-body">
        ${error}
        <div class="file-card">
          <div class="file-card__icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.5 3.8h7l4 4v12.4a.8.8 0 0 1-.8.8H6.5a.8.8 0 0 1-.8-.8V4.6a.8.8 0 0 1 .8-.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 3.9v4h4M9 12h6M9 15h6M9 18h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <h3>选择 JSON 文件</h3>
          <p>支持桌面版完整备份，也支持单日词表 JSON。</p>
          <button class="btn btn-primary" type="button" data-action="choose-json">从「文件」选择</button>
        </div>
        <div class="or-line">或</div>
        <button class="btn btn-secondary btn-block" type="button" data-action="paste-mode">粘贴 JSON 文本</button>
        <div class="note-box"><strong>导入规则：</strong>只新增手机上没有的单词，不覆盖已有的记忆进度。电脑备份里的旧词会被跳过。</div>
      </div>`;
  }

  function renderImportPreview() {
    const pkg = ui.pendingImport;
    const analysis = analyzePackage(pkg);
    const totalWords = pkg.days.reduce((sum, day) => sum + day.words.length, 0);
    const startDay = analysis.startDay;
    const title = analysis.newCount
      ? `Day ${startDay} · ${analysis.newCount} 个新词`
      : '没有新词';
    const subtitle = `${pkg.days.length} 天 · 共 ${totalWords} 词${analysis.duplicateCount ? ` · ${analysis.duplicateCount} 个已在手机` : ''}`;

    const warnings = pkg.warnings.length
      ? `<ul class="warnings">${pkg.warnings.slice(0, 6).map((warning) => `<li>${escapeHtml(warning)}</li>`).join('')}${pkg.warnings.length > 6 ? `<li>还有 ${pkg.warnings.length - 6} 条提示…</li>` : ''}</ul>`
      : '';

    const days = analysis.changedDays.length
      ? analysis.changedDays.map((day) => `
        <div class="changed-day">
          <div class="changed-day__head">
            <strong>Day ${day.day}</strong>
            <span>${escapeHtml(day.note || '')}</span>
            <em>新增 ${day.newCount}</em>
          </div>
          <ul class="changed-words">
            ${day.words.slice(0, 6).map((word) => `<li><b>${escapeHtml(word.word)}</b><small>${escapeHtml(word.meaning)}</small></li>`).join('')}
          </ul>
        </div>`).join('')
      : '<div class="empty-note"><strong>这些词都已经在手机上了</strong>没有需要新增的内容。</div>';

    const fileLine = ui.fileName ? `<p>文件：${escapeHtml(ui.fileName)}</p>` : '';

    els.sheetContent.innerHTML = `
      ${sheetHead('识别完成', '确认后导入，只新增，不覆盖手机进度', '导入')}
      <div class="sheet-body">
        <div class="import-summary">
          <div class="import-summary__top">
            <div>
              <h3>${escapeHtml(title)}</h3>
              <p>${escapeHtml(subtitle)}</p>
              ${fileLine}
            </div>
            <span class="badge ${analysis.newCount ? 'badge-ok' : 'badge-idle'}">${analysis.newCount ? '可导入' : '已存在'}</span>
          </div>
          <div class="import-stats">
            <div class="import-stat"><strong>${analysis.newCount}</strong><span>新增</span></div>
            <div class="import-stat"><strong>${analysis.duplicateCount}</strong><span>跳过</span></div>
            <div class="import-stat"><strong>${pkg.days.length}</strong><span>识别天数</span></div>
          </div>
        </div>
        ${warnings}
        <div class="changed-days">${days}</div>
        <div class="note-box">导入后，新词会立即加入手机词单。旧词和已背记录保持原样。</div>
        <button class="btn btn-ghost btn-block" style="margin-top:10px" type="button" data-action="reset-import">重新选择</button>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" type="button" data-action="close-sheet">取消</button>
        <span class="spacer"></span>
        <button class="btn btn-primary" type="button" data-action="commit-import" ${analysis.newCount ? '' : 'disabled'}>
          ${analysis.newCount ? `导入并开始 Day ${startDay}` : '没有新词'}
        </button>
      </div>`;
  }

  function afterSheetRender() {
    if (!ui.sheet || ui.sheet.kind !== 'import') return;
    if (!ui.pasteMode) return;
    const textarea = $('#pasteInput');
    if (textarea) {
      textarea.value = ui.pasteDraft;
      try { textarea.focus({ preventScroll: true }); } catch (error) { textarea.focus(); }
    }
  }

  function renderDaySheet() {
    const day = getDayByNumber(ui.sheet?.day);
    if (!day) {
      closeSheet();
      return;
    }

    const stats = getDayStats(day);
    const actions = [];
    if (stats.unlearned > 0) {
      actions.push(`<button class="btn btn-primary" type="button" data-action="study-day" data-day="${day.day}">学习剩余 ${stats.unlearned} 词</button>`);
    }
    if (stats.due > 0) {
      actions.push(`<button class="btn btn-secondary" type="button" data-action="review-day" data-day="${day.day}">复习本天 ${stats.due} 词</button>`);
    }

    const rows = day.words.map((word) => {
      const label = stageLabel(word);
      let tagClass = 'stage-tag';
      if (!word.learned) tagClass += ' is-new';
      else if (word.mastered) tagClass += ' is-mastered';
      else if (isDue(word)) tagClass += ' is-due';

      return `
        <div class="word-row">
          <div class="word-row__top">
            <span class="word-row__word">${escapeHtml(word.word)}</span>
            <span class="${tagClass}">${escapeHtml(label)}</span>
          </div>
          <p class="word-row__meaning">${escapeHtml(word.meaning)}</p>
          <div class="word-row__meta"><span>${escapeHtml(dueText(word))}</span><span>复习 ${word.reviewCount || 0} 次</span></div>
        </div>`;
    }).join('');

    els.sheetContent.innerHTML = `
      ${sheetHead(`Day ${day.day}`, `${stats.total} 个单词 · 已学 ${stats.learned} / ${stats.total}`, '词单')}
      <div class="sheet-body">
        <div class="day-detail-stats">
          <div class="day-detail-stat"><strong>${stats.total}</strong><span>总词数</span></div>
          <div class="day-detail-stat"><strong>${stats.learned}</strong><span>已学</span></div>
          <div class="day-detail-stat"><strong>${stats.due}</strong><span>待复习</span></div>
          <div class="day-detail-stat"><strong>${stats.mastered}</strong><span>已掌握</span></div>
        </div>
        <div class="detail-actions">${actions.length ? actions.join('') : '<span class="note-box">本天暂时没有待办。</span>'}</div>
        <div class="word-scroll">${rows}</div>
      </div>
      <div class="sheet-foot"><button class="btn btn-ghost" type="button" data-action="close-sheet">关闭</button></div>`;
  }

  function chooseJson() {
    ui.filePurpose = 'merge';
    els.fileInput.value = '';
    els.fileInput.click();
  }

  function readMergeFile(file) {
    if (!file) return;
    if (!ui.sheet || ui.sheet.kind !== 'import') openImportSheet();
    ui.importLoading = true;
    ui.importError = '';
    ui.pendingImport = null;
    ui.fileName = file.name || '';
    renderSheet();

    if (file.size > MAX_IMPORT_BYTES) {
      ui.importLoading = false;
      ui.importError = '文件太大（超过 10 MB），请确认这是词表 JSON。';
      renderSheet();
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const pkg = parseJsonText(String(reader.result || ''));
        ui.pendingImport = pkg;
        ui.importError = '';
      } catch (error) {
        ui.importError = error.message || '无法识别这个 JSON 文件。';
      } finally {
        ui.importLoading = false;
        renderSheet();
      }
    };
    reader.onerror = () => {
      ui.importLoading = false;
      ui.importError = '读取文件失败，请重新选择。';
      renderSheet();
    };
    reader.readAsText(file, 'utf-8');
  }

  function commitImport() {
    if (!ui.pendingImport) return;
    const analysis = analyzePackage(ui.pendingImport);
    if (!analysis.newCount) {
      ui.importError = '没有可新增的单词。';
      renderSheet();
      return;
    }

    const result = mergePackage(ui.pendingImport);
    const startDay = result.startDay;
    ui.pendingImport = null;
    ui.fileName = '';
    closeSheet();
    renderApp();
    showToast(`已新增 ${result.added} 个单词${result.skipped ? `，跳过 ${result.skipped} 个已有词` : ''}。`);
    if (startDay) {
      setTimeout(() => {
        if (!ui.study) startStudy('learn', { day: startDay });
      }, 180);
    }
  }

  function resetImport() {
    ui.pendingImport = null;
    ui.importError = '';
    ui.importLoading = false;
    ui.pasteMode = false;
    ui.fileName = '';
    renderSheet();
  }

  /* ------------------------------------------------------------------ */
  /* Backup / restore / clear                                           */
  /* ------------------------------------------------------------------ */

  function backupPayload() {
    return { app: '拾词 iPhone', version: 1, exportedAt: nowIso(), data: state };
  }

  function fallbackDownload(json) {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `拾词手机备份-${todayKey()}.json`;
    anchor.rel = 'noopener';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('手机存档已导出到文件。');
  }

  async function exportPhoneData() {
    if (!state.days.length) {
      showToast('还没有可以导出的数据。', 'error');
      return;
    }
    const json = JSON.stringify(backupPayload(), null, 2);
    const filename = `拾词手机备份-${todayKey()}.json`;

    try {
      const file = new File([json], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '拾词手机存档' });
        return;
      }
    } catch (error) {
      if (error && error.name === 'AbortError') return;
    }

    try {
      fallbackDownload(json);
    } catch (error) {
      showToast('导出失败，请重试。', 'error');
    }
  }

  function restorePhoneFile(file) {
    if (!file) return;
    if (file.size > MAX_IMPORT_BYTES) {
      showToast('备份文件太大。', 'error');
      return;
    }
    showToast('正在读取备份…');
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const raw = JSON.parse(String(reader.result || '').replace(/^\uFEFF/, ''));
        const data = raw && raw.data ? raw.data : raw;
        const next = normalizeState(data);
        if (!next || !next.days.length) {
          throw new Error('这不是完整的手机备份文件。');
        }
        const total = next.days.reduce((sum, day) => sum + day.words.length, 0);
        const okay = window.confirm(`将用备份中的 ${next.days.length} 天、${total} 个单词覆盖当前手机数据，确定继续吗？`);
        if (!okay) return;

        state = next;
        saveState();
        renderApp();
        showToast('手机存档已恢复。');
      } catch (error) {
        showToast(error.message || '备份文件无法识别。', 'error');
      }
    };
    reader.onerror = () => showToast('读取备份失败。', 'error');
    reader.readAsText(file, 'utf-8');
  }

  function clearAllData() {
    const okay = window.confirm('将删除手机上的全部词单和记忆记录，且无法恢复。确定继续吗？');
    if (!okay) return;
    state = freshState();
    saveState();
    renderApp();
    showToast('手机数据已清空。');
  }

  /* ------------------------------------------------------------------ */
  /* Study                                                              */
  /* ------------------------------------------------------------------ */

  function startStudy(mode, options = {}) {
    if (ui.study) return;
    if (!els.sheetLayer.hidden) closeSheet();

    let words = [];
    let dayNumber = null;
    let modeLabel = '';

    if (mode === 'learn') {
      let day = options.day ? getDayByNumber(options.day) : getNextUnlearnedDay();
      if (!day) {
        showToast('没有待学习的新词。', 'error');
        return;
      }
      words = day.words
        .filter((word) => !word.learned)
        .sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));
      dayNumber = day.day;
      modeLabel = '新词学习';
    } else if (mode === 'review') {
      let pool = allWords();
      if (options.day) {
        const day = getDayByNumber(options.day);
        if (!day) {
          showToast('没有找到这天的词单。', 'error');
          return;
        }
        pool = day.words;
      }
      words = shuffle(pool.filter(isDue));
      modeLabel = '到期复习';
    } else {
      return;
    }

    if (!words.length) {
      showToast(mode === 'review' ? '今天没有到期复习。' : '没有待学习的新词。', 'error');
      return;
    }

    ui.study = {
      mode,
      modeLabel,
      dayNumber,
      queue: words.map((word) => ({ wordId: word.id, retry: false })),
      cursor: 0,
      revealed: false,
      finished: false,
      firstTotal: words.length,
      firstDone: 0,
      firstRemembered: 0,
      firstForgot: 0,
      retryTotal: 0,
      retryDone: 0,
      recovered: 0,
      notRecovered: 0,
      startedAt: Date.now()
    };

    els.studyLayer.hidden = false;
    els.studyStage.hidden = false;
    els.studySummary.hidden = true;
    els.studySummary.innerHTML = '';
    renderStudyCard();
  }

  function currentStudyCard() {
    return ui.study ? (ui.study.queue[ui.study.cursor] || null) : null;
  }

  function renderStudyCard() {
    const session = ui.study;
    if (!session || session.finished) return;
    const card = currentStudyCard();
    if (!card) {
      finishStudy();
      return;
    }

    const context = getWordContext(card.wordId);
    if (!context) {
      session.cursor += 1;
      if (session.cursor >= session.queue.length) finishStudy();
      else renderStudyCard();
      return;
    }

    const word = context.word;
    const isRetry = Boolean(card.retry);
    session.revealed = false;

    els.studyStage.hidden = false;
    els.studyStage.scrollTop = 0;
    els.studySummary.hidden = true;
    els.studyMode.textContent = isRetry ? '错词巩固' : session.modeLabel;
    els.studyDay.textContent = `Day ${context.day.day}`;
    els.studyCount.textContent = isRetry
      ? `${session.retryDone + 1} / ${session.retryTotal}`
      : `${session.firstDone + 1} / ${session.firstTotal}`;
    els.studyProgress.style.width = `${isRetry ? 100 : (session.firstDone / Math.max(1, session.firstTotal)) * 100}%`;

    els.cardTag.textContent = isRetry ? '再记一次' : (session.mode === 'learn' ? '新词' : '到期复习');
    els.cardTag.className = `pill${isRetry ? ' is-retry' : ''}`;
    els.cardIndex.textContent = isRetry
      ? `Day ${context.day.day} · 巩固`
      : `Day ${context.day.day} · ${session.mode === 'learn' ? '首次学习' : `第 ${word.stage} 阶`}`;
    els.studyWord.textContent = word.word;
    els.studyMeaning.textContent = word.meaning;
    els.meaningBox.hidden = true;
    els.answerBar.hidden = true;
    els.revealBtn.hidden = false;
    els.studyHint.textContent = isRetry
      ? '刚才没记住，再回想一次，然后重新判断。'
      : '先在心里回想，再显示释义。如实作答即可。';

    els.flashcard.classList.remove('card-enter');
    void els.flashcard.offsetWidth;
    els.flashcard.classList.add('card-enter');

    setTimeout(() => {
      if (ui.study && ui.study.cursor === session.cursor && !ui.study.revealed) {
        try { els.revealBtn.focus({ preventScroll: true }); } catch (error) { els.revealBtn.focus(); }
      }
    }, 70);
  }

  function revealCurrent() {
    const session = ui.study;
    if (!session || session.finished || session.revealed) return;
    session.revealed = true;
    els.meaningBox.hidden = false;
    els.revealBtn.hidden = true;
    els.answerBar.hidden = false;
    els.studyHint.textContent = '根据真实记忆选择，不需要猜。没记住的词会安排明天重来。';
    try { els.studyStage.focus({ preventScroll: true }); } catch (error) { els.studyStage.focus(); }
  }

  function answerCurrent(result) {
    const session = ui.study;
    if (!session || session.finished || !session.revealed) return;
    const card = currentStudyCard();
    if (!card) return;

    const context = getWordContext(card.wordId);
    if (context) {
      if (card.retry) {
        session.retryDone += 1;
        if (result === 'remember') session.recovered += 1;
        else session.notRecovered += 1;
      } else {
        session.firstDone += 1;
        if (result === 'remember') {
          session.firstRemembered += 1;
          applyRemember(context.word);
        } else {
          session.firstForgot += 1;
          applyForget(context.word);
          session.queue.push({ wordId: context.word.id, retry: true });
          session.retryTotal += 1;
        }
        markStudyToday();
      }
    }

    session.cursor += 1;
    session.revealed = false;
    saveState();

    if (session.cursor >= session.queue.length) finishStudy();
    else renderStudyCard();
  }

  function finishStudy() {
    const session = ui.study;
    if (!session) return;
    session.finished = true;
    els.studyStage.hidden = true;
    els.studySummary.hidden = false;
    els.studyMode.textContent = '本轮完成';
    els.studyCount.textContent = '完成';
    els.studyProgress.style.width = '100%';
    renderStudySummary();
    saveState();
  }

  function renderStudySummary() {
    const session = ui.study;
    if (!session) return;
    const pct = session.firstTotal ? Math.round((session.firstRemembered / session.firstTotal) * 100) : 0;
    const remainingDue = allWords().filter(isDue).length;
    const nextDay = getNextUnlearnedDay();
    const nextDayStats = nextDay ? getDayStats(nextDay) : null;

    let title = '今天记下了。';
    if (session.firstForgot === 0) title = '一遍就记住了。';
    else if (pct < 60) title = '重复，是记住的开始。';

    const eyebrow = session.mode === 'review'
      ? '到期复习完成'
      : `Day ${session.dayNumber || ''} · 新词完成`.trim();
    const note = session.firstForgot === 0
      ? '这些词已按记忆曲线完成本轮安排，不需要今天重复。'
      : `${session.firstForgot} 个词已安排在明天重新出现${session.recovered ? `，其中 ${session.recovered} 个在本轮巩固中想起` : ''}。`;

    const extra = [];
    if (remainingDue > 0) {
      extra.push(`<button class="btn btn-secondary" type="button" data-action="continue-review">继续复习 ${remainingDue} 词</button>`);
    } else if (session.mode === 'review' && nextDay && nextDayStats) {
      extra.push(`<button class="btn btn-secondary" type="button" data-action="learn-day" data-day="${nextDay.day}">学习 Day ${nextDay.day}</button>`);
    }

    els.studySummary.innerHTML = `
      <div class="summary-card">
        <p class="overline">${escapeHtml(eyebrow)}</p>
        <h2>${title}</h2>
        <div class="summary-score">
          <div class="summary-ring" style="--pct:${pct}">
            <div class="summary-ring__inner"><strong>${pct}%</strong><span>一次记住</span></div>
          </div>
          <div class="summary-copy">
            <strong>${session.firstRemembered} / ${session.firstTotal} 个词一次记住</strong>
            <p>${session.firstForgot ? `还有 ${session.firstForgot} 个需要再见面。` : '这一轮的状态很稳。'}</p>
          </div>
        </div>
        <div class="summary-stats">
          <div class="summary-stat"><strong>${session.firstRemembered}</strong><span>一次记住</span></div>
          <div class="summary-stat"><strong>${session.firstForgot}</strong><span>需要加强</span></div>
          <div class="summary-stat"><strong>${session.recovered}</strong><span>巩固后记住</span></div>
        </div>
        <p class="summary-note">${note}</p>
        <div class="summary-actions">
          <button class="btn btn-primary" type="button" data-action="close-study">完成，回到今日</button>
          ${extra.join('')}
        </div>
      </div>`;

    setTimeout(() => {
      const button = els.studySummary.querySelector('[data-action="close-study"]');
      if (button) {
        try { button.focus({ preventScroll: true }); } catch (error) { button.focus(); }
      }
    }, 70);
  }

  function closeStudy(force = false) {
    if (!ui.study) return;
    if (!force && !ui.study.finished && ui.study.firstDone > 0) {
      if (!window.confirm('本次背诵还没完成，确定退出吗？已作答的单词会保存。')) return;
    }
    ui.study = null;
    els.studyLayer.hidden = true;
    els.studySummary.innerHTML = '';
    ui.tab = 'today';
    renderApp();
  }

  /* ------------------------------------------------------------------ */
  /* Events                                                             */
  /* ------------------------------------------------------------------ */

  document.addEventListener('click', (event) => {
    const tabTrigger = event.target.closest('[data-tab]');
    if (tabTrigger) {
      switchTab(tabTrigger.dataset.tab);
      return;
    }

    const trigger = event.target.closest('[data-action]');
    if (!trigger) return;
    const action = trigger.dataset.action;

    switch (action) {
      case 'open-import':
        openImportSheet();
        break;
      case 'open-paste':
        openPasteSheet();
        break;
      case 'close-sheet':
        closeSheet();
        break;
      case 'choose-json':
        chooseJson();
        break;
      case 'paste-mode':
        ui.pasteMode = true;
        ui.importError = '';
        ui.pendingImport = null;
        renderSheet();
        break;
      case 'back-to-file':
        ui.pasteMode = false;
        ui.pendingImport = null;
        ui.importError = '';
        renderSheet();
        break;
      case 'parse-paste': {
        try {
          const pkg = parseJsonText(ui.pasteDraft);
          ui.pendingImport = pkg;
          ui.importError = '';
          renderSheet();
        } catch (error) {
          ui.importError = error.message || 'JSON 无法识别。';
          renderSheet();
        }
        break;
      }
      case 'reset-import':
        resetImport();
        break;
      case 'commit-import':
        commitImport();
        break;
      case 'open-day':
        openSheet('day', { day: Number(trigger.dataset.day) });
        break;
      case 'study-day':
      case 'learn-day': {
        const day = Number(trigger.dataset.day);
        if (Number.isInteger(day)) {
          if (ui.study) closeStudy(true);
          if (ui.sheet) closeSheet();
          startStudy('learn', { day });
        }
        break;
      }
      case 'review-day': {
        const day = Number(trigger.dataset.day);
        if (Number.isInteger(day)) {
          if (ui.study) closeStudy(true);
          if (ui.sheet) closeSheet();
          startStudy('review', { day });
        }
        break;
      }
      case 'review-all':
        if (ui.study) closeStudy(true);
        startStudy('review');
        break;
      case 'reveal':
        revealCurrent();
        break;
      case 'answer':
        answerCurrent(trigger.dataset.result === 'remember' ? 'remember' : 'forgot');
        break;
      case 'exit-study':
        closeStudy();
        break;
      case 'close-study':
        closeStudy(true);
        break;
      case 'continue-review':
        closeStudy(true);
        startStudy('review');
        break;
      case 'export-phone':
        exportPhoneData();
        break;
      case 'restore-phone':
        ui.filePurpose = 'restore';
        els.fileInput.value = '';
        els.fileInput.click();
        break;
      case 'clear-data':
        clearAllData();
        break;
      default:
        break;
    }
  });

  els.sheetLayer.addEventListener('click', (event) => {
    if (event.target === els.sheetLayer) closeSheet();
  });

  document.addEventListener('input', (event) => {
    if (event.target && event.target.id === 'pasteInput') {
      ui.pasteDraft = event.target.value;
    }
  });

  els.fileInput.addEventListener('change', () => {
    const file = els.fileInput.files && els.fileInput.files[0];
    els.fileInput.value = '';
    if (!file) return;
    if (ui.filePurpose === 'restore') {
      restorePhoneFile(file);
    } else {
      readMergeFile(file);
    }
    ui.filePurpose = 'merge';
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (!els.sheetLayer.hidden) {
        event.preventDefault();
        closeSheet();
        return;
      }
      if (!els.studyLayer.hidden) {
        event.preventDefault();
        closeStudy();
        return;
      }
    }

    if (!els.sheetLayer.hidden) {
      if (event.key === 'Tab') trapFocus(els.sheetContent, event);
      return;
    }

    if (!els.studyLayer.hidden && event.key === 'Tab') {
      trapFocus(els.studyLayer, event);
      return;
    }

    if (els.studyLayer.hidden || !ui.study || ui.study.finished) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;

    if (event.code === 'Space' && !ui.study.revealed) {
      event.preventDefault();
      revealCurrent();
      return;
    }

    if (ui.study.revealed && (event.key === '1' || event.key === '2')) {
      event.preventDefault();
      answerCurrent(event.key === '1' ? 'remember' : 'forgot');
    }
  });

  function trapFocus(container, event) {
    if (!container) return;
    const selectors = 'button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const focusable = $$(selectors, container).filter((element) => element.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  init();
})();

  </script>
